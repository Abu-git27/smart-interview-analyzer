<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Interview Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f7f6;
            padding-top: 50px;
            font-family: sans-serif;
        }
        .card {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 class="mb-4">🤖 Smart Interview Analyzer</h1>

    <div class="card p-5">
        <textarea id="interviewText" class="form-control mb-4" rows="4" placeholder="Type or speak your answer..."></textarea>

        <button onclick="startVoice()" class="btn btn-secondary btn-lg mb-2">🎤 Speak</button><br>

        <button onclick="analyzeInterview()" class="btn btn-primary btn-lg">Analyze My Answer</button>
    </div>

    <div id="resultSection" class="mt-4 d-none">
        <div class="card p-4">
            <h3 class="text-success">AI Analysis Report</h3>

            <p><strong>Emotion:</strong> <span id="emotion"></span></p>
            <p><strong>Status:</strong> <span id="status"></span></p>
            <h4>Score: <span id="score"></span>%</h4>

            <h5 class="mt-3">Feedback:</h5>
            <ul id="feedbackList"></ul>
        </div>
    </div>
</div>

<script>

// 🎤 Voice Recognition
function startVoice() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("Use Google Chrome for voice feature.");
        return;
    }

    const recognition = new webkitSpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('interviewText').value = transcript;
    };

    recognition.onerror = function(event) {
        console.error(event.error);
    };
}

// 🧠 Analyze
async function analyzeInterview() {
    const text = document.getElementById('interviewText').value;

    try {
        const response = await fetch('https://smart-interview-analyzer.onrender.com', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ text: text })
        });

        if (!response.ok) throw new Error("Backend Error");

        const data = await response.json();

        document.getElementById('resultSection').classList.remove('d-none');
        document.getElementById('emotion').innerText = data.emotion_analysis.emotion;
        document.getElementById('status').innerText = data.emotion_analysis.status;
        document.getElementById('score').innerText = data.final_score.total;

        const feedbackList = document.getElementById('feedbackList');
        feedbackList.innerHTML = "";

        data.feedback.forEach(item => {
            const li = document.createElement('li');
            li.innerText = item;
            feedbackList.appendChild(li);
        });

    } catch (error) {
        alert("❌ CONNECTION FAILED!\n\nMake sure backend is running.");
        console.error(error);
    }
}

</script>

</body>
</html>
